{{- if and .Values.llm.apiKey (not .Values.llm.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-llm" (include "kalam.fullname" .) }}
  labels: {{- include "kalam.labels" . | nindent 4 }}
type: Opaque
stringData:
  GEMINI_API_KEY: {{ .Values.llm.apiKey | quote }}
  KALAM_AUTH_KEY: {{ .Values.llm.apiKey | quote }}
{{- end }}
