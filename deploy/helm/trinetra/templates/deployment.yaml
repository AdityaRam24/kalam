apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trinetra.fullname" . }}
  labels: {{- include "trinetra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.persistence.enabled }}
  # A ReadWriteOnce volume cannot be shared, and two replicas would each keep
  # their own inventory anyway — roll one pod at a time onto the same disk.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "trinetra.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trinetra.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/kubeconfig: {{ include (print $.Template.BasePath "/kubeconfig.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
        {{- if and .Values.llm.apiKey (not .Values.llm.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "trinetra.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: trinetra
          image: {{ include "trinetra.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3001"
            - name: HOME
              value: /home/kalam
            # See templates/kubeconfig.yaml for why this is not left to kubectl.
            - name: KUBECONFIG
              value: /etc/kalam/kubeconfig/config
            {{- with (include "trinetra.allowedHosts" .) }}
            - name: ALLOWED_HOSTS
              value: {{ . | quote }}
            {{- end }}
            # State that must survive a restart lives on the mounted volume.
            - name: KALAM_VMS_PATH
              value: /data/inventory/vms.json
            - name: KALAM_LEARNED_PATH
              value: /data/inventory/learned.json
            - name: KALAM_KB_PATH
              value: /data/pcai/kb.json
            - name: KALAM_HISTORY_DIR
              value: /data/history
            - name: KALAM_METRICS_DIR
              value: /data/metrics
            # Engine defaults a fresh browser starts with (GET /api/llm/defaults).
            - name: KALAM_LLM_ENABLED
              value: {{ ne (toString .Values.llm.enabled) "false" | quote }}
            - name: KALAM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            - name: KALAM_LOCAL_URL
              value: {{ .Values.llm.localUrl | quote }}
            - name: KALAM_LOCAL_MODEL
              value: {{ .Values.llm.localModel | quote }}
            {{- if or .Values.llm.apiKey .Values.llm.existingSecret }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "trinetra.secretName" . }}
                  key: {{ .Values.llm.existingSecretKey }}
                  optional: true
            {{- end }}
            {{- if .Values.config.history.enabled }}
            - name: KALAM_HISTORY
              value: "true"
            - name: KALAM_HISTORY_INTERVAL_SEC
              value: {{ .Values.config.history.intervalSec | quote }}
            - name: KALAM_HISTORY_RETENTION_DAYS
              value: {{ .Values.config.history.retentionDays | quote }}
            - name: KALAM_HISTORY_SOURCES
              value: {{ .Values.config.history.sources | quote }}
            {{- end }}
            {{- if .Values.config.metrics.enabled }}
            - name: KALAM_METRICS
              value: "1"
            - name: KALAM_METRICS_INTERVAL_SEC
              value: {{ .Values.config.metrics.intervalSec | quote }}
            - name: KALAM_METRICS_RETENTION_HOURS
              value: {{ .Values.config.metrics.retentionHours | quote }}
            - name: KALAM_METRICS_SOURCES
              value: {{ .Values.config.metrics.sources | quote }}
            {{- end }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.enabled }}
          # /healthz does no work, so a slow apiserver or a missing container
          # runtime never gets a healthy Trinetra restarted.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: 6
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/kalam
            - name: kubeconfig
              mountPath: /etc/kalam/kubeconfig
              readOnly: true
            {{- if .Values.ssh.secretName }}
            - name: ssh-key
              mountPath: /home/kalam/.ssh
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "trinetra.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: home
          emptyDir:
            sizeLimit: 64Mi
        - name: kubeconfig
          configMap:
            name: {{ include "trinetra.fullname" . }}-kubeconfig
        {{- if .Values.ssh.secretName }}
        - name: ssh-key
          secret:
            secretName: {{ .Values.ssh.secretName }}
            # Group-readable: the pod runs as uid 10001 and reads the key
            # through fsGroup, not as the file's owner.
            defaultMode: 0440
            items:
              - key: {{ .Values.ssh.keyFile }}
                path: id_rsa
              {{- with .Values.ssh.knownHosts }}
              - key: {{ . }}
                path: known_hosts
              {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
