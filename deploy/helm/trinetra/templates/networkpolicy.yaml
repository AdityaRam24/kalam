{{- if .Values.networkPolicy.enabled }}
# Restrict who may reach the Trinetra pod. The API can drive kubectl and SSH, so
# on a shared cluster it should be reachable only through the ingress path, not
# from any pod in the cluster. Egress is left open: Trinetra must reach the
# Kubernetes API, DNS, SSH hosts and (if configured) a model endpoint.
#
# With every source disabled this becomes a default-deny-ingress policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trinetra.fullname" . }}
  labels: {{- include "trinetra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "trinetra.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- $sources := list }}
    {{- if .Values.networkPolicy.ingressFromIstio }}
    {{- $sources = append $sources .Values.networkPolicy.istioNamespace }}
    {{- end }}
    {{- range .Values.networkPolicy.extraNamespaces }}
    {{- $sources = append $sources . }}
    {{- end }}
    {{- if $sources }}
    - from:
        {{- range $sources }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
{{- end }}
