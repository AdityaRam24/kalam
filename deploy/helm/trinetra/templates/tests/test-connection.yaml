# `helm test <release>`: proves the Service routes to a live Trinetra. Uses the
# Trinetra image itself, so it needs nothing the install didn't already pull.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "trinetra.fullname" . }}-test
  labels: {{- include "trinetra.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    sidecar.istio.io/inject: "false"
spec:
  restartPolicy: Never
  securityContext: {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: check
      image: {{ include "trinetra.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      command: ["node", "-e"]
      args:
        - |
          const base = 'http://{{ include "trinetra.fullname" . }}:{{ .Values.service.port }}';
          (async () => {
            for (const p of ['/healthz', '/api/llm/defaults', '/']) {
              const r = await fetch(base + p);
              if (!r.ok) throw new Error(p + ' -> HTTP ' + r.status);
              console.log('ok', p);
            }
          })().catch((e) => { console.error(String(e)); process.exit(1); });
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }
