# An explicit kubeconfig built on the pod's own ServiceAccount.
#
# kubectl only falls back to in-cluster credentials when its config is exactly
# the built-in default — and any override flag breaks that. Trinetra passes
# --request-timeout on every cluster read, so without this file those reads
# go to localhost:8080 and the dashboard shows an empty cluster. tokenFile is
# re-read by kubectl, so projected-token rotation keeps working.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trinetra.fullname" . }}-kubeconfig
  labels: {{- include "trinetra.labels" . | nindent 4 }}
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: {{ include "trinetra.serviceAccountName" . }}
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          user: {{ include "trinetra.serviceAccountName" . }}
          namespace: {{ .Release.Namespace }}
    current-context: in-cluster
