apiVersion: v1
kind: Service
metadata:
  name: {{ include "kalam.fullname" . }}
  labels: {{- include "kalam.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      # "http" also tells Istio the protocol, so the PCAI gateway routes it as HTTP.
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector: {{- include "kalam.selectorLabels" . | nindent 4 }}
