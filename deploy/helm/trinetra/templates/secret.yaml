{{- if and .Values.llm.apiKey (not .Values.llm.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-llm" (include "trinetra.fullname" .) }}
  labels: {{- include "trinetra.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.llm.existingSecretKey }}: {{ .Values.llm.apiKey | quote }}
{{- end }}
