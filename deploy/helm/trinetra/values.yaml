# ─────────────────────────────────────────────────────────────────────────────
# Kalam — default values.
#
# Out of the box this installs a read-only console: it can SEE the cluster it
# runs in and nothing else. Two things are deliberately opt-in because they
# widen what the app can do, and both are called out where they appear:
#   * rbac.allowWrite  — lets the UI restart/scale/delete workloads
#   * ssh.secretName   — lets it reach machines outside this cluster
#
# The bundle's install.sh fills in image.repository, the PCAI domain / ingress
# host, persistence and the LLM endpoint for you. Everything here is also safe
# to set by hand with `--set` or a values file.
# ─────────────────────────────────────────────────────────────────────────────

image:
  # install.sh sets this to wherever it pushed the bundled image
  # (your registry, or the per-node cache at 127.0.0.1:5959).
  repository: kalam
  tag: ""                 # defaults to .Chart.AppVersion
  digest: ""              # optional sha256:...; pins the image when set
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1           # see persistence.enabled before raising this

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP         # ClusterIP | NodePort | LoadBalancer
  port: 80
  nodePort: null          # only with type NodePort; null lets Kubernetes pick
  annotations: {}

# ── HPE Private Cloud AI (Istio) ────────────────────────────────────────────
# PCAI publishes applications through its Istio gateway rather than an
# Ingress, and puts platform SSO (Keycloak via oauth2-proxy) in front of them.
# This block follows the PCAI "Import Framework" chart contract: when the chart
# is imported through the PCAI UI, ${DOMAIN_NAME} is substituted by the
# platform. Installed with the helm CLI, install.sh detects the domain.
#
# Rendered only when the Istio APIs exist in the cluster AND the endpoint is a
# real hostname (not an unsubstituted ${...} placeholder), so the same chart
# installs cleanly on a non-PCAI cluster.
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"
  virtualService:
    endpoint: "kalam.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
  # SSO in front of Kalam. Strongly recommended: the API can run kubectl and
  # SSH actions, so it should never be reachable without a login.
  authorizationPolicy:
    enabled: true
    namespace: "istio-system"
    providerName: "oauth2-proxy"
    matchLabels:
      istio: "ingressgateway"

# ── Plain Kubernetes Ingress (non-PCAI clusters) ────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  # The hostname the browser uses. It is also added to the app's own allowlist
  # (see config.allowedHosts) — without that the API refuses the origin.
  host: kalam.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

# ── What Kalam may do to the cluster it runs in ─────────────────────────────
rbac:
  create: true
  # false → read-only (get/list/watch). The dashboard, topology map, inspect
  # drawer and change history all work; the action buttons return "forbidden".
  # true  → also permits the write verbs behind those buttons:
  #         deployment restart/scale, pod delete.
  allowWrite: false
  # GPU Utilization page: runs `nvidia-smi` inside GPU pods (kubectl exec).
  # That needs create on pods/exec, which in principle allows running any
  # command in any pod — set false to keep Kalam strictly read-only (the page
  # then shows GPU requests and allocation, without live nvidia-smi readings).
  allowGpuExec: true
  # Cluster-wide read (all namespaces) vs a Role limited to this namespace.
  clusterWide: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── AI engine ───────────────────────────────────────────────────────────────
# Kalam's backend makes the call, so THIS POD must be able to reach the
# endpoint. For an in-cluster MLIS/vLLM/Ollama service that is a Service DNS
# name; for Gemini it needs egress to the internet. These are the defaults a
# fresh browser starts with — anyone can still change them under Settings.
llm:
  # false hides every AI feature (Agent Chat, Agent Teamwork, PCAI Assistant,
  # Settings, the stack health read) and the server refuses their routes.
  enabled: true
  provider: local                       # local | gemini
  localUrl: http://ollama.ai.svc.cluster.local:11434/v1
  localModel: qwen2.5-coder:7b
  # Gemini key. Supply EITHER existingSecret (recommended) or apiKey, which the
  # chart puts into a Secret for you.
  apiKey: ""
  existingSecret: ""                    # key: GEMINI_API_KEY
  existingSecretKey: GEMINI_API_KEY

config:
  # Browser origins allowed to drive the API, comma separated; a leading dot
  # matches a whole domain. "true" allows any — only sane behind SSO.
  # Empty → the PCAI endpoint / ingress host this chart publishes.
  allowedHosts: ""
  # Opt-in periodic cluster fingerprinting for the change-history view.
  history:
    enabled: false
    intervalSec: 300
    retentionDays: 30
    sources: local                      # local | all | local,vm-a,...
  # Opt-in CPU/memory/disk sampling of inventory VMs for the Metrics view.
  metrics:
    enabled: false
    intervalSec: 30
    retentionHours: 48
    sources: all                        # all | vm-a,vm-b
  extraEnv: []

# ── SSH to machines outside the cluster ─────────────────────────────────────
# Mounting a key is what turns Kalam from "this cluster" into "the estate".
# Leave empty to run cluster-only. The key appears in the pod as
# ~/.ssh/id_rsa — use that as the key path when adding a VM in the UI.
ssh:
  secretName: ""        # Secret holding the private key (install.sh --ssh-key creates it)
  keyFile: id_rsa       # key inside that Secret
  knownHosts: ""        # optional key inside that Secret holding known_hosts

# ── Writable state ──────────────────────────────────────────────────────────
# The SSH inventory, the PCAI knowledge base, the change history and metrics
# are written to /data. Without a volume they reset on every restart.
# install.sh turns this on when the cluster has a default StorageClass.
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Probes hit /healthz, which does no work — so a slow apiserver or an absent
# container runtime is never mistaken for a broken Kalam.
probes:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 15

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # State goes to /data; /tmp (tsx compile cache) and $HOME (kubectl's
  # discovery cache) get their own emptyDirs, so the image itself stays sealed.
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
